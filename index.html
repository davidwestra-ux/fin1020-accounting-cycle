<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Why Source Documents Are Important | FIN1020</title>
  <meta name="description" content="FIN1020 interactive: Why Source Documents Are Important">
  <style>
    :root {
      color-scheme: light;
      --navy: #17365d;
      --blue: #2f75b5;
      --light: #eef4f9;
      --text: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--light), #ffffff);
    }
    header {
      padding: 18px 24px;
      background: var(--navy);
      color: white;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 2rem);
    }
    header p {
      margin: 6px 0 0;
      opacity: .9;
    }
    main {
      width: min(1000px, 100%);
      margin: 0 auto;
      padding: 24px 16px 36px;
    }
    .player-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(23, 54, 93, .16);
    }
    #player-container {
      width: min(750px, 100%);
      aspect-ratio: 750 / 470;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
      border: 1px solid #ccd6e0;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
    .note {
      max-width: 750px;
      margin: 16px auto 0;
      font-size: .95rem;
      line-height: 1.5;
      color: #4b5563;
    }
    noscript {
      display: block;
      padding: 16px;
      background: #fff3cd;
      border: 1px solid #ffe69c;
    }
  </style>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "visible",
      backgroundColor: "#FFFFFF",
      letterbox: "on",
      warnOnUnsupportedContent: true
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <header>
    <h1>Why Source Documents Are Important</h1>
    <p>FIN1020 — Accounting Cycle 1</p>
  </header>

  <main>
    <section class="player-card" aria-label="FIN1020 interactive">
      <div id="player-container"></div>
      <p class="note">
        This legacy Flash activity is presented through Ruffle, an open-source
        Flash emulator that runs in modern browsers.
      </p>
      <noscript>This activity requires JavaScript to be enabled.</noscript>
    </section>
  </main>

  <script>
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("player-container").appendChild(player);
      player.load({
        url: "fin1020_mm004.swf",
        autoplay: "on"
      });
    });
  </script>
</body>
</html>
